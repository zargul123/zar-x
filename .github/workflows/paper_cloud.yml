# Zar X — THE PAPER-WATCH, THE CLOUD's OWN RECORD.
# PAPER ONLY. NO MONEY. It holds no key and sends no order anywhere.
#
# Three times each morning (00:07, 01:07 and 03:07 UTC = 05:07, 06:07 and
# 08:07 in Pakistan) it works the cloud's paper record, journal/paper_cloud/,
# and commits it with two text reports. The second and third runs are there
# in case the first is late or a source is down: a run with nothing new
# writes nothing new to the record.
#
# The laptop keeps its OWN record in journal/paper/. This job never writes
# there. Each record's report says whether the two agree.
#
# The job ends RED - which GitHub mails to the repository's owner - on
# INTEGRITY ALARM, on OFFLINE, or when the two records disagree. The report
# is committed first either way.

name: Paper Watch (cloud record)

on:
  schedule:
    - cron: '7 0,1,3 * * *'
  push:
    paths:
      - '.github/workflows/paper_cloud.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cloud-snapshot
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install parts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Work the cloud's paper record
        id: work
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor
          PYTHONUTF8: '1'
        run: |
          set +e
          python journal/paper_watch.py --cloud > journal/paper_cloud_report.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          python journal/paper_watch.py --cloud --week > journal/paper_cloud_week.txt
          sed -n '1,12p' journal/paper_cloud_report.txt
          sed -n '/^HEALTH/,$p' journal/paper_cloud_report.txt
          exit 0

      - name: Commit the record and the reports
        run: |
          git config user.name "zarx-cloud-watchman"
          git config user.email "actions@github.com"
          git add journal/paper_cloud journal/paper_cloud_report.txt journal/paper_cloud_week.txt
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "cloud: paper-watch $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin main

      - name: Say so loudly if something is wrong
        if: steps.work.outputs.code != '0'
        run: |
          echo "The paper-watch reported an INTEGRITY ALARM, OFFLINE, or the two records disagree. Read journal/paper_cloud_report.txt."
          exit 1
