# Zar X — the cloud probe. ONE QUESTION: can the paper-watch live here?
# It reads three public sources, works the existing paper ledger out again
# and runs Gate 7.1, then commits ONE small text file with what it found.
# It writes nothing to journal/paper/, sends no order and holds no key.
# It runs when this file or journal/cloud_probe.py is pushed, or by hand.
# It is NOT on a clock: it never runs by itself.

name: Paper Cloud Probe

on:
  push:
    paths:
      - 'journal/cloud_probe.py'
      - '.github/workflows/paper_cloud_test.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cloud-snapshot
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install parts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor
          PYTHONUTF8: '1'
        run: |
          python journal/cloud_probe.py | tee journal/cloud_probe_report.txt
          echo "probed $(date -u '+%Y-%m-%d %H:%M') UTC on a GitHub runner" >> journal/cloud_probe_report.txt

      - name: Commit the finding
        run: |
          git config user.name "zarx-cloud-watchman"
          git config user.email "actions@github.com"
          git status --short
          git add journal/cloud_probe_report.txt
          git commit -m "cloud: the paper-watch probe $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin main
